<style>
/* Layout: one phone-width column; month grid on top, tapped day's timeline below */
[hidden]{display:none!important}
:root{
  --bg:#eef2f1; --card:#ffffff; --fg:#17201f; --muted:#5d6b69; --line:#d5dedc;
  --accent:#0f6e6a; --free:#2e8b57; --freebg:#dff1e6; --tight:#b7791f; --tightbg:#fbefd7;
  --full:#c0392b; --fullbg:#f8dedb; --off:#9aa6a4; --offbg:#e6eceb; --oh:#5b4bb7;
  --font:system-ui,"Noto Sans Thai",sans-serif; --mono:ui-monospace,"Roboto Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1716; --card:#172221; --fg:#e4ecea; --muted:#9db0ad; --line:#2b3a38;
  --accent:#4fc2bb; --free:#5fcf8c; --freebg:#173528; --tight:#e6b04d; --tightbg:#3a2e14;
  --full:#f07a6c; --fullbg:#3d1d1a; --off:#6b7a78; --offbg:#1d2928; --oh:#a79bf2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1716; --card:#172221; --fg:#e4ecea; --muted:#9db0ad; --line:#2b3a38;
  --accent:#4fc2bb; --free:#5fcf8c; --freebg:#173528; --tight:#e6b04d; --tightbg:#3a2e14;
  --full:#f07a6c; --fullbg:#3d1d1a; --off:#6b7a78; --offbg:#1d2928; --oh:#a79bf2; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.5}
.wrap{max-width:440px;margin:0 auto;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.note{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
.next{background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.next b{color:var(--free)}
.next .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
.mhead{display:flex;align-items:center;justify-content:space-between}
.mhead h1{font-size:19px;margin:0;font-weight:700}
.mhead button{background:var(--card);border:1px solid var(--line);color:var(--fg);border-radius:8px;width:40px;height:36px;font-size:18px;cursor:pointer}
.mhead button:disabled{opacity:.35}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{text-align:center;font-size:12px;color:var(--muted);padding-bottom:2px}
.cell{min-height:58px;border-radius:8px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;color:var(--off);border:2px solid transparent;background:transparent}
.cell.op{cursor:pointer;color:var(--fg)}
.cell.free{background:var(--freebg)}.cell.tight{background:var(--tightbg)}.cell.full{background:var(--fullbg)}
.cell.closed{background:var(--offbg)}
.cell.sel{border-color:var(--accent)}
.cell .d{font-weight:600}
.cell .s{font-family:var(--mono);font-size:10.5px;line-height:1.2}
.cell.free .s{color:var(--free)}.cell.tight .s{color:var(--tight)}.cell.full .s{color:var(--full)}.cell.closed .s{color:var(--off)}
.cell .tag{font-size:9.5px;color:var(--oh);font-weight:600;line-height:1.1}
.cell.past{opacity:.45}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}

.sum{font-size:13.5px;color:var(--muted)}
.case{display:grid;grid-template-columns:62px 1fr;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.case .t{font-family:var(--mono);font-size:12.5px;color:var(--muted);line-height:1.35}
.case .n{font-weight:600}
.case .o{font-size:13.5px;color:var(--muted)}
.type{font-size:11px;font-weight:700;padding:0 6px;border-radius:4px;margin-right:4px}
.type.GA{background:var(--tightbg);color:var(--tight)}.type.LA{background:var(--freebg);color:var(--free)}
.warn{color:var(--full);font-size:12.5px}

.cut{border-top:2px solid var(--full);padding-top:4px;font-size:12px;color:var(--full);font-weight:600}
.slot{border:2px dashed var(--free);border-radius:10px;padding:8px 10px;color:var(--free);font-weight:600;font-size:14px}
.slot.t{border-color:var(--tight);color:var(--tight)}
.err{color:var(--full);font-size:13px;white-space:pre-wrap}
.demo{font-size:12.5px;color:var(--tight);background:var(--tightbg);border-radius:10px;padding:8px 12px}
.ph{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;padding:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--offbg);cursor:pointer;color:var(--fg);font-weight:600}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.bad::after{content:"ไม่มีรูป";font-size:11px;color:var(--muted)}
.thumb.bad img{display:none}
.viewer{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.vbar{display:flex;align-items:center;gap:8px;padding:10px max(12px,env(safe-area-inset-left,0px));color:#eee;font-size:14px}
.vbar span{flex:1;min-width:0;text-align:center}
.vbar button{background:#333;color:#fff;border:0;border-radius:8px;width:44px;height:40px;font-size:18px;cursor:pointer}
.link{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);text-decoration:underline;text-underline-offset:3px;cursor:pointer;text-align:left}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:99px;font-size:13.5px;max-width:90%}

<script src="repository.js"></script>
<script>
// OrQueue: estimate the OR timeline of one day and how much room is left.
// Pure functions, no Memento API, so the same code runs in the mini app,
// in the mockup and in node tests (test/orqueue.test.js).
//
// Rules (kim, 2026-11-13):
//  - OR days: every Monday, plus days with a Holidays entry of calendar "Kim"
//    titled "OR นอกเวลา" (Saturdays). There is never OR นอกเวลา on a Monday.
//  - Start 08:30.
//  - LA (OPD) cases go first while the first GA patient is prepared (2-3 cases),
//    and between GA cases (about 2 cases) instead of waiting for the GA turnover.
//    OPD LA is never the last case. Admitted LA may be done after the last GA.
//  - GA cases: shortest first (not by Que), so the long one is last.
//  - Turnover: GA -> GA 45 min on Monday, 20 min OR นอกเวลา (2 rooms alternate).
//    LA -> LA and LA <-> GA 15 min (different room, op note).
//  - Monday: a new GA can be added when the current last GA ends by 14:30
//    (the second-to-last case must finish by 14:30; the last may run late).
//  - OR นอกเวลา: the last case must START before 16:00.
//  - Missing OpLength: assume GA 60 min, LA 15 min.

var orq = {
  START: 8 * 60 + 30,
  MON_CUT: 14 * 60 + 30,
  OH_LAST_START: 16 * 60,
  GA_TURN: { MON: 45, OH: 20 },
  SWITCH: 15,
  DEFAULT_LEN: { GA: 60, LA: 15 },
  LA_FIRST_MAX: 3,   // LA before the first GA
  LA_GAP_MAX: 2,     // LA between two GA
  GREEN_MIN: 60,     // minutes left for "free" (green); less = "tight" (yellow)

  // Kind of day from the Holidays entries of that date.
  // hols: [{ title, calendar, holiday:Boolean, outOfDuty:Boolean }]
  // returns null (not an OR day), {kind:"closed", why}, or {kind:"op", mode:"MON"|"OH"}
  dayKind: function (date, hols) {
    hols = hols || [];
    var off = hols.filter(function (h) { return h.outOfDuty; });
    if (off.length) return { kind: "closed", why: off[0].title || "ไม่อยู่" };
    var oh = hols.some(function (h) {
      return h.calendar == "Kim" && /or\s*นอกเวลา/i.test(h.title || "");
    });
    if (oh) return { kind: "op", mode: "OH" };
    if (date.getDay() !== 1) return null;
    var hol = hols.filter(function (h) { return h.holiday; });
    if (hol.length) return { kind: "closed", why: hol[0].title || "วันหยุด" };
    return { kind: "op", mode: "MON" };
  },

  // cases: [{ type:"GA"|"LA", que:Number, minutes:Number|null, visit:"OPD"|"Admit", ...anything }]
  // returns rows (in time order) with s/e = start/end in minutes from midnight.
  simulate: function (mode, cases) {
    var self = this;
    var norm = function (c) {
      var m = Number(c.minutes);
      var guess = !(m > 0);
      return Object.assign({}, c, { guess: guess, len: guess ? self.DEFAULT_LEN[c.type] : Math.round(m) });
    };
    var byQue = function (a, b) { return (Number(a.que) || 99) - (Number(b.que) || 99); };
    var ga = cases.filter(function (c) { return c.type == "GA"; }).map(norm)
      .sort(function (a, b) { return a.len - b.len || byQue(a, b); });
    var la = cases.filter(function (c) { return c.type != "GA"; }).map(norm).sort(byQue);
    var opd = la.filter(function (c) { return c.visit != "Admit"; });
    var adm = la.filter(function (c) { return c.visit == "Admit"; });

    var rows = [];
    var t = this.START;
    var push = function (c, s, where) {
      rows.push(Object.assign({}, c, { s: s, e: s + c.len, where: where }));
      t = s + c.len;
    };

    if (ga.length == 0) {           // LA only day
      opd.concat(adm).forEach(function (c, i) { push(c, i ? t + self.SWITCH : t, ""); });
      return { rows: rows, gaEnds: [], end: rows.length ? t : null };
    }

    // slots[0] = before the first GA, slots[i] = between GA i-1 and GA i
    var slots = [];
    for (var i = 0; i < ga.length; i++) slots.push([]);
    var cap = function (i) { return i == 0 ? self.LA_FIRST_MAX : self.LA_GAP_MAX; };
    var fill = function (list) {
      var rest = [];
      list.forEach(function (c) {
        for (var i = 0; i < slots.length; i++) {
          if (slots[i].length < cap(i)) { slots[i].push(c); return; }
        }
        rest.push(c);
      });
      return rest;
    };
    var opdRest = fill(opd);
    // OPD LA must not be last: overflow goes into the last slot (before the last GA)
    opdRest.forEach(function (c) { slots[slots.length - 1].push(c); });
    var admRest = fill(adm);

    var gaEnds = [];
    ga.forEach(function (g, i) {
      var start;
      if (i == 0) {
        slots[0].forEach(function (c, j) { push(c, j ? t + self.SWITCH : self.START, "ก่อน GA เคสแรก"); });
        start = slots[0].length ? t + self.SWITCH : self.START;
      } else {
        var ready = t + self.GA_TURN[mode];
        slots[i].forEach(function (c) { push(c, t + self.SWITCH, "ระหว่างรอ GA"); });
        start = slots[i].length ? Math.max(ready, t + self.SWITCH) : ready;
      }
      push(g, start, "");
      gaEnds.push(t);
    });
    admRest.forEach(function (c) { push(c, t + self.SWITCH, "หลัง GA เสร็จ"); });
    return { rows: rows, gaEnds: gaEnds, end: t };
  },

  // Room left on a day. status: "free" | "tight" | "full"
  //  MON: left = 14:30 - end of the last GA (LA can always be added)
  //  OH : left = 16:00 - time a new GA could start
  dayStatus: function (mode, cases) {
    var sim = this.simulate(mode, cases);
    var left, nextStart;
    if (mode == "MON") {
      var lastGa = sim.gaEnds.length ? sim.gaEnds[sim.gaEnds.length - 1] : this.START;
      left = this.MON_CUT - lastGa;
      nextStart = sim.gaEnds.length ? lastGa + this.GA_TURN.MON : (sim.end != null ? sim.end + this.SWITCH : this.START);
    } else {
      nextStart = sim.end == null ? this.START : sim.end + this.GA_TURN.OH;
      left = this.OH_LAST_START - nextStart;
    }
    var status = left < 0 ? "full" : (left >= this.GREEN_MIN ? "free" : "tight");
    return Object.assign(sim, { mode: mode, left: Math.max(left, 0), status: status, nextStart: nextStart });
  },

  hm: function (m) {
    return ("0" + Math.floor(m / 60)).slice(-2) + ":" + ("0" + (m % 60)).slice(-2);
  }
};


// ===================== DATA =====================
// loadMemento(from, to) returns a Promise of { cases: [...], hols: [...] } for dates from..to.
//   cases: one per UroBase entry
//     { date: Date, type: ORType ("GA"|"LA"), que: Que, minutes: OpLength in minutes (null if empty),
//       visit: VisitType ("OPD"|"Admit"), status: Status, dr: Dr, name: Patient link title, op: Op, dx: Dx,
//       photos: Photo field (image) as an array of strings an <img src> in this app can show; [] if none,
//       id: the entry id (used by openEntry) }
//   hols: one per Holidays entry
//     { date: Date, title: Title, calendar: Calendar, holiday: Holiday (bool), outOfDuty: OutOfDuty (bool) }
// UroBase OpLength is a duration in milliseconds -> divide by 60000.
// loadMemento and openEntry are the only functions that talk to Memento (through repo in repository.js,
// written by the Memento Builder). Read only, never write.
async function loadMemento(from, to) {
  if (typeof repo == "undefined") throw new Error("NOT_CONNECTED");   // outside Memento (mockup)
  var dayString = function (date) {
    return date.getFullYear() + "-" + ("0" + (date.getMonth() + 1)).slice(-2) + "-" + ("0" + date.getDate()).slice(-2);
  };
  var asDate = function (value) {
    if (!value) return null;
    if (value instanceof Date) return new Date(value.getFullYear(), value.getMonth(), value.getDate());
    var match = String(value).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (match) return new Date(Number(match[1]), Number(match[2]) - 1, Number(match[3]));
    var parsed = new Date(value);
    return isNaN(parsed.getTime()) ? null : new Date(parsed.getFullYear(), parsed.getMonth(), parsed.getDate());
  };
  var range = { $gte: dayString(from), $lte: dayString(to) };
  var results = await Promise.all([
    repo.urobase.list({ where: { date: range } }),
    repo.holidays.list({ where: { date: range } })
  ]);
  var cases = results[0].map(function (entry) {
    var patient = entry.patient;
    var patientName = Array.isArray(patient) ? (patient[0] && patient[0].title) : (patient && patient.title);
    var filenames = Array.isArray(entry.photo) ? entry.photo : [];
    return {
      id: entry.id,
      date: asDate(entry.date),
      type: entry.ortype,
      que: entry.que,
      minutes: entry.oplength == null || !(Number(entry.oplength) > 0) ? null : Number(entry.oplength) / 60000,
      visit: entry.visittype,
      status: entry.status,
      dr: entry.dr,
      name: patientName || "ไม่ระบุชื่อ",
      op: entry.op,
      dx: entry.dx,
      photos: filenames.map(function (filename) {
        return repo.urobase.fileUrl(entry.id, "photo", filename, { size: 512 });
      })
    };
  }).filter(function (item) { return item.date; });
  var hols = results[1].map(function (entry) {
    return {
      date: asDate(entry.date),
      title: entry.title_2,
      calendar: entry.calendar,
      holiday: !!entry.holiday,
      outOfDuty: !!entry.outofduty
    };
  }).filter(function (item) { return item.date; });
  return { cases: cases, hols: hols };
}

// openEntry(c) opens the UroBase entry c (c.id) in Memento's entry view card. Resolves false if it cannot.
async function openEntry(c) {
  if (!c || !c.id || typeof repo == "undefined") return false;
  try {
    var entry = await repo.urobase.lib.findById(c.id);
    if (!entry) return false;
    await entry.show();
    return true;
  } catch (err) {
    return false;
  }
}

var DR = "ชัยพร";          // only kim's cases (empty Dr is counted too)
var MONTHS_AHEAD = 3;

function keepCase(c) {
  return c.status != "Not" && (!c.dr || String(c.dr).indexOf(DR) > -1) && (c.type == "GA" || c.type == "LA");
}

// Demo data (fake patients) used when Memento is not connected, e.g. in the mockup.
function demoData(today) {
  var d = function (n) { var x = new Date(today); x.setDate(x.getDate() + n); return x; };
  var firstMon = (8 - today.getDay()) % 7 || 7;
  var mon = function (w) { return d(firstMon + 7 * w); };
  var sat = function (w) { return d(firstMon + 7 * w + 5); };
  var C = function (date, type, que, op, minutes, visit, name) {
    var photos = /URS|PCNL|lithotripsy|DJ/.test(op) ? [demoPhoto("KUB", name), demoPhoto("CT", name)] : [];
    return { id: "demo-" + name, date: date, type: type, que: que, op: op, minutes: minutes, visit: visit, name: "ผู้ป่วยทดสอบ " + name, status: "Plan", dr: DR, photos: photos };
  };
  var cases = [
    C(mon(0), "LA", 1, "Cystoscopy + DJ removal", 10, "OPD", "ก"), C(mon(0), "LA", 2, "Circumcision", 25, "OPD", "ข"),
    C(mon(0), "LA", 3, "TRUS biopsy", 20, "OPD", "ค"), C(mon(0), "LA", 4, "Cystoscopy", 10, "OPD", "ง"),
    C(mon(0), "GA", 1, "TURBT", 50, "Admit", "จ"), C(mon(0), "GA", 2, "URS + laser lithotripsy", 70, "Admit", "ฉ"),
    C(mon(0), "GA", 3, "PCNL", 150, "Admit", "ช"),
    C(sat(0), "GA", 1, "URS + laser lithotripsy", 65, "Admit", "ซ"), C(sat(0), "GA", 2, "TURP", 75, "Admit", "ฌ"),
    C(sat(0), "GA", 3, "TURBT", 45, "Admit", "ญ"), C(sat(0), "GA", 4, "DJ insertion", null, "Admit", "ฎ"),
    C(mon(1), "LA", 1, "Vasectomy", 30, "OPD", "ฏ"), C(mon(1), "GA", 1, "Radical nephrectomy (lap)", 180, "Admit", "ฐ"),
    C(mon(1), "GA", 2, "URS", 60, "Admit", "ฑ"),
    C(mon(2), "GA", 1, "TURBT", 50, "Admit", "ฒ"),
    C(sat(4), "GA", 1, "PCNL", 140, "Admit", "ณ"), C(sat(4), "GA", 2, "URS + laser lithotripsy", 70, "Admit", "ด"),
    C(sat(4), "GA", 3, "TURP", 80, "Admit", "ต"), C(sat(4), "GA", 4, "TURBT", 50, "Admit", "ถ"),
    C(sat(4), "GA", 5, "URS", 60, "Admit", "ท"),
    C(mon(5), "LA", 1, "TRUS biopsy", 15, "OPD", "ธ"), C(mon(5), "GA", 1, "TURP", 80, "Admit", "น"),
    C(mon(5), "GA", 2, "URS", 60, "Admit", "บ"), C(mon(5), "LA", 2, "Circumcision", 25, "Admit", "ป")
  ];
  var H = function (date, title, calendar, holiday, outOfDuty) {
    return { date: date, title: title, calendar: calendar, holiday: !!holiday, outOfDuty: !!outOfDuty };
  };
  var hols = [
    H(sat(0), "OR นอกเวลา", "Kim"), H(sat(2), "OR นอกเวลา", "Kim"), H(sat(4), "OR นอกเวลา", "Kim"),
    H(sat(7), "OR นอกเวลา", "Kim"), H(sat(10), "OR นอกเวลา", "Kim"),
    H(mon(3), "วันหยุดชดเชย", "Holidays", true, false), H(mon(8), "ไม่อยู่ (ประชุม)", "Kim", false, true)
  ];
  return { cases: cases, hols: hols };
}

// Placeholder picture for the demo (not a real image).
function demoPhoto(kind, tag) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="500" viewBox="0 0 400 500"><rect width="400" height="500" fill="#222"/>' +
    '<ellipse cx="140" cy="230" rx="55" ry="95" fill="#555"/><ellipse cx="265" cy="230" rx="55" ry="95" fill="#555"/>' +
    '<circle cx="' + (kind == "CT" ? 150 : 255) + '" cy="250" r="12" fill="#eee"/>' +
    '<text x="200" y="460" fill="#aaa" font-size="28" text-anchor="middle" font-family="sans-serif">' + kind + ' ตัวอย่าง ' + tag + '</text></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

// ===================== VIEW =====================
var TH_M = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
var TH_D = ["อา", "จ", "อ", "พ", "พฤ", "ศ", "ส"];
var TH_DL = ["อาทิตย์", "จันทร์", "อังคาร", "พุธ", "พฤหัสบดี", "ศุกร์", "เสาร์"];
var key = function (d) { return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); };
var hm = function (m) { return orq.hm(m); };
var dur = function (m) { return m >= 60 ? Math.floor(m / 60) + " ชม." + (m % 60 ? " " + m % 60 + " น." : "") : m + " น."; };
var short = function (m) { return m >= 60 ? (m / 60).toFixed(m % 60 ? 1 : 0) + "ชม" : m + "น"; };
var thDate = function (d) { return "วัน" + TH_DL[d.getDay()] + "ที่ " + d.getDate() + " " + TH_M[d.getMonth()].slice(0, 3) + "."; };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); };
var $ = function (id) { return document.getElementById(id); };

var TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
var END = new Date(TODAY); END.setMonth(END.getMonth() + MONTHS_AHEAD);
var CASES = {}, HOLS = {}, mOff = 0, sel = null;

function index(data) {
  CASES = {}; HOLS = {};
  data.cases.filter(keepCase).forEach(function (c) {
    var k = key(new Date(c.date)); (CASES[k] = CASES[k] || []).push(c);
  });
  data.hols.forEach(function (h) { var k = key(new Date(h.date)); (HOLS[k] = HOLS[k] || []).push(h); });
}

function dayInfo(d) {
  var k = key(d), kind = orq.dayKind(d, HOLS[k]), cases = CASES[k] || [];
  if (!kind) return cases.length ? { kind: "extra", cases: cases } : null;
  if (kind.kind == "closed") return Object.assign(kind, { cases: cases });
  return Object.assign({ kind: "op" }, orq.dayStatus(kind.mode, cases));
}

var lim = function (i) { return i.mode == "MON" ? "ก่อน 14:30 (GA)" : "ก่อน 16:00"; };

function renderNext() {
  var out = [];
  for (var d = new Date(TODAY); d <= END && out.length < 2; d.setDate(d.getDate() + 1)) {
    if (d <= TODAY) continue;
    var i = dayInfo(d);
    if (i && i.kind == "op" && i.status != "full") out.push([new Date(d), i]);
  }
  $("next").innerHTML = '<span class="lbl">วันที่ยังแทรกได้ใกล้สุด</span>' + (out.length ? out.map(function (x) {
    return "<div><b>" + thDate(x[0]) + "</b> " + (x[1].mode == "OH" ? "(OR นอกเวลา) " : "") + "· เหลือ " + dur(x[1].left) + " " + lim(x[1]) + "</div>";
  }).join("") : "<div>ไม่มีวันว่างใน " + MONTHS_AHEAD + " เดือน</div>");
}

function renderMonth() {
  var base = new Date(TODAY.getFullYear(), TODAY.getMonth() + mOff, 1);
  $("mtitle").textContent = TH_M[base.getMonth()] + " " + (base.getFullYear() + 543);
  $("prev").disabled = mOff == 0; $("nextm").disabled = mOff == MONTHS_AHEAD;
  var g = $("grid");
  g.innerHTML = TH_D.map(function (x) { return '<div class="dow">' + x + "</div>"; }).join("");
  for (var i = 0; i < base.getDay(); i++) g.insertAdjacentHTML("beforeend", "<div></div>");
  var n = new Date(base.getFullYear(), base.getMonth() + 1, 0).getDate();
  for (var day = 1; day <= n; day++) (function (d) {
    var info = dayInfo(d), el = document.createElement("button");
    el.className = "cell"; el.type = "button"; el.innerHTML = '<span class="d">' + d.getDate() + "</span>";
    if (info) {
      var cls = info.kind == "op" ? info.status : info.kind == "closed" ? "closed" : "full";
      el.classList.add("op", cls);
      if (d < TODAY) el.classList.add("past");
      if (info.kind == "closed") el.innerHTML += '<span class="s">ปิด</span>' + (info.cases.length ? '<span class="tag">มีเคส!</span>' : "");
      else if (info.kind == "extra") el.innerHTML += '<span class="s">' + info.cases.length + ' เคส</span><span class="tag">นอกวัน OR</span>';
      else {
        el.innerHTML += '<span class="s">' + info.rows.length + ' เคส</span><span class="s">' + (info.status == "full" ? "เต็ม" : "+" + short(info.left)) + "</span>";
        if (info.mode == "OH") el.innerHTML += '<span class="tag">นอกเวลา</span>';
      }
      el.onclick = function () { sel = key(d); renderMonth(); renderDay(d); };
      if (sel == key(d)) el.classList.add("sel");
    } else el.disabled = true;
    g.appendChild(el);
  })(new Date(base.getFullYear(), base.getMonth(), day));
}

var ENTRIES = [];
function tapEntry(i) {
  var c = ENTRIES[i];
  Promise.resolve().then(function () { return openEntry(c); }).catch(function () { return false; }).then(function (ok) {
    if (ok === false) toast("เปิด entry ไม่ได้" + (c && String(c.id).indexOf("demo-") == 0 ? " (ข้อมูลตัวอย่าง)" : ""));
  });
}
function toast(msg) {
  var t = $("toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast.h); toast.h = setTimeout(function () { t.hidden = true; }, 2500);
}

function caseRow(r) {
  var i = ENTRIES.push(r) - 1;
  return '<div class="case"><div class="t">' + (r.s != null ? hm(r.s) + "<br>" + hm(r.e) : "") + '</div><div><div class="n"><span class="type ' + r.type + '">' + r.type + " " + esc(("0" + (r.que || "")).slice(-2)) + '</span><button type="button" class="link" onclick="tapEntry(' + i + ')">' + esc(r.name) + " ›</button>" +
    '</div><div class="o">' + esc(r.op) + (r.guess ? "" : r.len ? " · " + dur(r.len) : "") + (r.visit ? " · " + esc(r.visit) : "") + (r.where ? " · " + r.where : "") + "</div>" +
    (r.guess ? '<div class="warn">ไม่มีเวลาผ่าตัดในข้อมูล ใช้ค่าประมาณ ' + orq.DEFAULT_LEN[r.type] + " น.</div>" : "") + photoStrip(r) + "</div></div>";
}

// Photo thumbnails (first 3), tap to open full screen.
var PHOTOS = [];
function photoStrip(r) {
  var list = (r.photos || []).filter(Boolean);
  if (!list.length) return "";
  var id = PHOTOS.push({ list: list, name: r.name }) - 1;
  var h = '<div class="ph">';
  list.slice(0, 3).forEach(function (src, j) {
    h += '<button type="button" class="thumb" onclick="openPhoto(' + id + "," + j + ')"><img loading="lazy" alt="รูป ' + (j + 1) + '" src="' + esc(src) + '" onerror="this.parentNode.classList.add(\'bad\')"></button>';
  });
  if (list.length > 3) h += '<button type="button" class="thumb more" onclick="openPhoto(' + id + ',3)">+' + (list.length - 3) + "</button>";
  return h + "</div>";
}
var view = { id: 0, j: 0 };
function openPhoto(id, j) { view = { id: id, j: j }; showPhoto(); $("viewer").hidden = false; }
function showPhoto() {
  var p = PHOTOS[view.id], n = p.list.length;
  view.j = (view.j + n) % n;
  $("vimg").src = p.list[view.j];
  $("vcap").textContent = p.name + " · รูป " + (view.j + 1) + "/" + n;
  $("vprev").hidden = $("vnext").hidden = n < 2;
}

function renderDay(d) {
  PHOTOS = []; ENTRIES = [];
  var i = dayInfo(d), box = $("day");
  if (i.kind != "op") {
    box.innerHTML = "<h2>" + thDate(d) + "</h2>" + (i.kind == "closed"
      ? '<span class="pill closed">ปิด</span><div class="sum">' + esc(i.why) + " (จาก Holidays)</div>"
      : '<span class="pill full">ไม่ใช่วัน OR</span>') + (i.cases.length ? '<div class="warn">มีเคสลงไว้วันนี้ ' + i.cases.length + " เคส</div>" + i.cases.map(caseRow).join("") : "");
    return;
  }
  var label = i.mode == "MON" ? { free: "แทรก GA ได้", tight: "แทรก GA ได้อีก 1 เคส", full: "GA เต็ม" }[i.status] : { free: "ว่าง", tight: "เหลือน้อย", full: "เต็ม" }[i.status];
  var h = "<h2>" + thDate(d) + '</h2><div><span class="pill ' + i.status + '">' + label + '</span> <span class="sum">' + (i.mode == "OH" ? "OR นอกเวลา · GA→GA 20 น." : "OR วันจันทร์ · GA→GA 45 น.") + " · สลับห้อง/LA 15 น.</span></div>";
  h += '<div class="sum">' + i.rows.length + " เคส" + (i.end != null ? " · คาดว่าเสร็จทั้งหมด " + hm(i.end) : "") + "</div>";
  var prevE = null, cut = false;
  i.rows.forEach(function (r) {
    if (i.mode == "MON" && !cut && r.type == "GA" && r.s > orq.MON_CUT) { h += '<div class="cut">14:30 · GA ที่เริ่มหลังจากนี้ต้องเป็นเคสสุดท้าย</div>'; cut = true; }
    if (prevE != null && r.s > prevE) h += '<div class="gap">' + (r.type == "GA" && r.s - prevE > orq.SWITCH ? "รอเปลี่ยนคนไข้/ดมยา" : "สลับห้อง/เตรียม") + " " + (r.s - prevE) + " น.</div>";
    h += caseRow(r); prevE = r.e;
  });
  if (i.status != "full") {
    h += i.mode == "MON"
      ? '<div class="slot ' + (i.status == "tight" ? "t" : "") + '">แทรก GA ได้ · เหลือ ' + dur(i.left) + ' ก่อน 14:30<br><span style="font-weight:400;font-size:13px">GA ใหม่ที่ยาวที่สุดของวันจะอยู่ท้ายสุด จึงยาวเท่าไรก็ได้ · LA OPD แทรกได้เสมอ</span></div>'
      : '<div class="slot ' + (i.status == "tight" ? "t" : "") + '">GA ใหม่เริ่มได้ราว ' + hm(i.nextStart) + " · เหลือ " + dur(i.left) + ' ก่อน 16:00<br><span style="font-weight:400;font-size:13px">เคสสุดท้ายต้องเริ่มก่อน 16:00</span></div>';
  } else h += '<div class="sum" style="color:var(--full)">' + (i.mode == "MON" ? "GA เคสสุดท้ายตอนนี้เสร็จหลัง 14:30 แล้ว ไม่ควรเพิ่ม GA (LA ยังแทรกได้)" : "เคสใหม่จะเริ่มหลัง 16:00 แล้ว") + "</div>";
  box.innerHTML = h;
}

function show(data, demo) {
  index(data);
  $("demo").hidden = !demo;
  renderNext();
  var first = null;
  for (var d = new Date(TODAY); d <= END && !first; d.setDate(d.getDate() + 1)) { var i = dayInfo(d); if (i && i.kind == "op") first = new Date(d); }
  if (first) { sel = key(first); mOff = (first.getFullYear() - TODAY.getFullYear()) * 12 + first.getMonth() - TODAY.getMonth(); }
  renderMonth();
  if (first) renderDay(first);
}

$("vclose").onclick = function () { $("viewer").hidden = true; $("vimg").removeAttribute("src"); };
$("vprev").onclick = function () { view.j--; showPhoto(); };
$("vnext").onclick = function () { view.j++; showPhoto(); };
$("vimg").onerror = function () { if ($("vimg").getAttribute("src")) $("vcap").textContent += " · เปิดรูปไม่ได้"; };
$("prev").onclick = function () { mOff--; renderMonth(); };
$("nextm").onclick = function () { mOff++; renderMonth(); };

var from = new Date(TODAY); from.setDate(1);
loadMemento(from, END).then(function (data) { show(data, false); }).catch(function (err) {
  if (String(err && err.message) != "NOT_CONNECTED") $("err").textContent = "อ่านข้อมูลจาก Memento ไม่ได้: " + (err && err.message || err);
  show(demoData(TODAY), true);
});
</script>
